services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: springtorch
      POSTGRES_USER: springtorch
      POSTGRES_PASSWORD: springtorch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springtorch -d springtorch"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:1.8.3
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

  backend:
    build:
      context: ./backend
    working_dir: /workspaces/SpringTorch
    volumes:
      - .:/workspaces/SpringTorch:cached
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springtorch
      SPRING_DATASOURCE_USERNAME: springtorch
      SPRING_DATASOURCE_PASSWORD: springtorch
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  jobs:
    build:
      context: ./jobs
      dockerfile: Dockerfile
    volumes:
      - qwen-model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started

volumes:
  postgres-data:
  qwen-model-cache:

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: springtorch
      POSTGRES_USER: springtorch
      POSTGRES_PASSWORD: springtorch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springtorch -d springtorch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    working_dir: /workspaces/SpringTorch
    volumes:
      - .:/workspaces/SpringTorch:cached
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/springtorch
      SPRING_DATASOURCE_USERNAME: springtorch
      SPRING_DATASOURCE_PASSWORD: springtorch
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
